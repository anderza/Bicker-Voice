name: Build Biker APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: biker-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BikerVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BikerVoice.apk
          gh release view v0.1.5 >/dev/null 2>&1 || gh release create v0.1.5 --title "BikerVoice 0.1.5" --notes "Saved encrypted gateway settings, prefilled server URL, connection test and clearer errors"
          gh release upload v0.1.5 BikerVoice.apk --clobber
