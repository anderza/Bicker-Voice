<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Байкер</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#354054,#10131c 75%);color:white;font:16px system-ui;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 16px}h1{font-size:24px}svg{width:min(90vw,390px);max-height:55vh;filter:drop-shadow(0 20px 20px #0008)}.panel{text-align:center;width:100%;max-width:450px}input{width:100%;padding:14px;border-radius:12px;background:#242b38;color:white;border:1px solid #667;font:inherit}button{padding:14px 16px;border-radius:12px;border:0;background:#f7a332;color:#181818;font-weight:bold;margin:10px 3px}#status{color:#ffc071;margin:12px}#mouth{transform-origin:200px 210px}body.talking #mouth{animation:talk .22s infinite alternate}body.blink #eyes{transform:scaleY(.1);transform-origin:200px 160px}@keyframes talk{to{transform:scaleY(2)}}p{font-size:12px;color:#aab}</style></head><body><h1>🏍️ Байкер</h1><svg viewBox="0 0 400 400"><path d="M100 265Q70 290 60 390H340Q330 290 300 265L250 245H150Z" fill="#1b1d25" stroke="#080a0e" stroke-width="7"/><path d="M160 265L200 380L240 265L220 250H180Z" fill="#ded9c9"/><path d="M145 270L187 370L160 346L170 330L135 320Z M255 270L213 370L240 346L230 330L265 320Z" fill="#343945" stroke="#090a0d" stroke-width="4"/><path d="M174 230V273Q200 290 226 273V230" fill="#e4a15b"/><ellipse cx="130" cy="170" rx="17" ry="26" fill="#e4a15b"/><ellipse cx="270" cy="170" rx="17" ry="26" fill="#e4a15b"/><path d="M132 110Q135 57 200 55Q266 58 269 110L262 218Q250 266 200 267Q150 260 138 218Z" fill="#edb36b" stroke="#322328" stroke-width="6"/><path d="M128 140Q106 66 152 65Q162 40 193 52Q233 30 254 67Q292 78 270 143L257 112Q222 91 197 103Q163 110 146 102Z" fill="#4a2d25" stroke="#24181b" stroke-width="6"/><path d="M150 143Q173 133 188 144M212 144Q236 132 252 143" stroke="#4a2d25" stroke-width="8" fill="none"/><g id="eyes"><ellipse cx="173" cy="163" rx="13" ry="15" fill="white"/><ellipse cx="228" cy="163" rx="13" ry="15" fill="white"/><circle cx="177" cy="165" r="5" fill="#222"/><circle cx="225" cy="165" r="5" fill="#222"/></g><path d="M199 168L191 200Q201 209 212 201" stroke="#b77d48" stroke-width="5" fill="none"/><path d="M141 208Q153 255 200 263Q252 257 263 208Q235 236 200 242Q165 236 141 208" fill="#513428"/><path d="M162 214Q200 200 238 214" stroke="#30211c" stroke-width="8" fill="none"/><path id="mouth" d="M176 222Q200 232 224 222Q217 241 200 243Q183 240 176 222Z" fill="#391c24" stroke="#241419" stroke-width="3"/><path d="M184 225Q200 229 216 225" stroke="white" stroke-width="5"/></svg><div class="panel"><div id="status">На связи</div><input id="phrase" value="Здорово, брат! Ну что, погнали?"><div><button id="speak">🔊 Сказать</button><button id="listen">🎙️ Слушать</button><button id="stop">■ Стоп</button></div><p>Демо анимации и речи. Пока без подключения к ChatGPT.</p></div><script>
const s=document.getElementById('status');function nativeSpeechStart(){document.body.classList.add('talking');s.textContent='Байкер говорит'}function nativeSpeechEnd(){document.body.classList.remove('talking');s.textContent='На связи'}
document.getElementById('speak').onclick=()=>AndroidVoice.speak(document.getElementById('phrase').value);
let stream,ctx,analyser,frame;
async function stopMic(){cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;document.body.classList.remove('talking')}
document.getElementById('listen').onclick=async()=>{await stopMic();try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();analyser=ctx.createAnalyser();analyser.fftSize=512;ctx.createMediaStreamSource(stream).connect(analyser);let data=new Uint8Array(512);s.textContent='Слушаю';function tick(){analyser.getByteTimeDomainData(data);let sum=0;for(let v of data)sum+=((v-128)/128)**2;document.body.classList.toggle('talking',Math.sqrt(sum/512)>.05);frame=requestAnimationFrame(tick)}tick()}catch(e){s.textContent='Микрофон недоступен'}};
document.getElementById('stop').onclick=async()=>{AndroidVoice.stop();await stopMic();nativeSpeechEnd()};setInterval(()=>{document.body.classList.add('blink');setTimeout(()=>document.body.classList.remove('blink'),160)},3500);
</script></body></html>
