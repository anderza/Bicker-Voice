<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikerVoice</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#10131c;color:#fff;font:16px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:16px;gap:12px}h1{font-size:23px;margin:0}canvas{width:min(88vw,390px,52vh);height:auto;aspect-ratio:1;display:block;border-radius:50%;background:#e9e5e5;box-shadow:0 8px 35px #0008;border:3px solid #495061}.panel{text-align:center;width:min(100%,450px)}input{width:100%;padding:14px;border-radius:12px;background:#242b38;color:#fff;border:1px solid #667;font:inherit}button{padding:12px;border-radius:10px;border:0;background:#f7a332;color:#181818;font-weight:bold;margin:7px 2px}#status{color:#ffc071;margin:8px}p{font-size:12px;color:#aab;margin:8px}.moods button{background:#303848;color:white;padding:8px}.moods button.active{background:#f7a332;color:#111}
</style></head><body><h1>🏍️ BikerVoice</h1><canvas id="avatar" width="480" height="480" aria-label="Байкер"></canvas><div class="panel"><div id="status" role="status">Загрузка карточки…</div><input id="phrase" value="Здорово, брат! Ну что, погнали?"><div><button id="speak">🔊 Сказать</button><button id="listen">🎙️ Слушать</button><button id="stop">■ Стоп</button></div><div class="moods" id="moods"></div><p>Демо речи и эмоций · без подключения к ChatGPT</p></div>
<script>
const s=document.getElementById('status'),canvas=document.getElementById('avatar'),g=canvas.getContext('2d'),sheet=new Image();
const rects=[[466,10,266,320],[740,10,266,320],[1008,10,260,320],[1269,10,251,320],[466,340,266,320],[740,340,266,320],[1008,340,260,320],[1269,340,251,320]];
const names=['Спокойствие','Смех','Злость','Удивление','Хитрость','Улыбка','Сомнение','Волнение'];let mood=0,ready=false,speaking=false,micActive=false,level=0,stream,ctx,analyser,frame,phase=0,micSession=0;
function draw(i){if(!ready)return;const [x,y,w,h]=rects[i],sx=sheet.naturalWidth/1536,sy=sheet.naturalHeight/1024;g.fillStyle='#e9e5e5';g.fillRect(0,0,480,480);const dh=480,dw=w/h*dh;g.drawImage(sheet,x*sx,y*sy,w*sx,h*sy,(480-dw)/2,0,dw,dh)}
sheet.onload=()=>{ready=true;draw(mood);s.textContent='На связи'};sheet.onerror=()=>{s.textContent='Не удалось открыть biker.png'};sheet.src='biker.png';
names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.classList.toggle('active',i===0);b.onclick=()=>{mood=i;document.querySelectorAll('.moods button').forEach((el,j)=>el.classList.toggle('active',j===i));draw(i)};document.getElementById('moods').appendChild(b)});
setInterval(()=>{phase++;if(speaking){draw([0,1,0,5,0,3][phase%6])}else if(micActive&&level>.05){draw(4)}else draw(mood)},180);
function nativeSpeechStart(){speaking=true;s.textContent='Байкер говорит'}function nativeSpeechEnd(){speaking=false;draw(mood);s.textContent=micActive?'Слушаю':'На связи'}
function nativeMicStarted(session){if(session!==micSession)return;micActive=true;s.textContent='Слушаю';}function nativeMicLevel(session,rms){if(session===micSession){level=rms;}}function nativeMicError(session,message){if(session!==micSession)return;micActive=false;level=0;s.textContent=message;draw(mood)}function nativeSpeechError(message){speaking=false;s.textContent=message;draw(mood)}function nativeAudioPaused(){micSession++;micActive=false;speaking=false;level=0;s.textContent='На связи';draw(mood)}
async function stopMic(){micSession++;if(window.AndroidVoice&&typeof AndroidVoice.stopMic==='function')AndroidVoice.stopMic();cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;micActive=false;level=0}
document.getElementById('speak').onclick=async()=>{await stopMic();const t=document.getElementById('phrase').value;if(window.AndroidVoice){AndroidVoice.speak(t)}else if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.onstart=nativeSpeechStart;u.onend=nativeSpeechEnd;u.onerror=nativeSpeechEnd;speechSynthesis.speak(u)}else{s.textContent='Озвучка недоступна'}};
document.getElementById('listen').onclick=async()=>{if(window.AndroidVoice)AndroidVoice.stop();else if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;await stopMic();if(window.AndroidVoice&&typeof AndroidVoice.startMic==='function'){s.textContent='Подключаю микрофон…';AndroidVoice.startMic(micSession);return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=512;ctx.createMediaStreamSource(stream).connect(analyser);let data=new Uint8Array(512);micActive=true;s.textContent='Слушаю';function tick(){analyser.getByteTimeDomainData(data);let sum=0;for(let v of data)sum+=((v-128)/128)**2;level=Math.sqrt(sum/512);frame=requestAnimationFrame(tick)}tick()}catch(e){await stopMic();s.textContent='Микрофон: '+(e.message||e.name||'неизвестная ошибка')}};
document.getElementById('stop').onclick=async()=>{if(window.AndroidVoice)AndroidVoice.stop();else if('speechSynthesis'in window)speechSynthesis.cancel();await stopMic();nativeSpeechEnd()};
</script></body></html>
