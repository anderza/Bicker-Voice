<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikerVoice</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#10131c;color:#fff;font:16px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:16px;gap:12px}h1{font-size:23px;margin:0}canvas{width:min(88vw,390px,52vh);height:auto;aspect-ratio:1;display:block;border-radius:50%;background:#e9e5e5;box-shadow:0 8px 35px #0008;border:3px solid #495061}.panel{text-align:center;width:min(100%,450px)}input{width:100%;padding:14px;border-radius:12px;background:#242b38;color:#fff;border:1px solid #667;font:inherit}button{padding:12px;border-radius:10px;border:0;background:#f7a332;color:#181818;font-weight:bold;margin:7px 2px}#status{color:#ffc071;margin:8px}p{font-size:12px;color:#aab;margin:8px}.voice{display:flex;align-items:center;gap:8px;margin:10px 0}.voice select{min-width:0;flex:1;background:#242b38;color:white;border:1px solid #667;border-radius:10px;padding:10px;font:inherit}#micMeter{height:4px;background:#303848;border-radius:2px;overflow:hidden}#micMeter span{display:block;height:100%;background:#f7a332;width:0}
</style></head><body><h1>🏍️ BikerVoice</h1><canvas id="avatar" width="480" height="480" aria-label="Байкер"></canvas><div class="panel"><div id="status" role="status">Загрузка карточки…</div><input id="phrase" placeholder="Спроси байкера…"><div><button id="speak">💬 Спросить GPT</button><button id="listen">🎙️ Слушать</button><button id="stop">■ Стоп</button></div><div id="micMeter"><span></span></div><div class="voice"><label for="voice">Голос</label><select id="voice"><option>Загрузка…</option></select><button id="sample">▶</button></div><div id="answer" style="white-space:pre-wrap;max-height:18vh;overflow:auto;text-align:left" aria-live="polite"></div><details><summary>⚙ Подключение GPT-5</summary><input id="endpoint" type="url" placeholder="https://сервер/chat" autocomplete="off"><input id="token" type="password" placeholder="Токен своего сервера (не ключ OpenAI)" autocomplete="off"><button id="resetChat">Новый разговор</button><p>Речь распознаётся сервисом Android; текст передаётся серверу и OpenAI. Токен хранится только в текущем сеансе.</p></details></div>
<script>
const s=document.getElementById('status'),canvas=document.getElementById('avatar'),g=canvas.getContext('2d'),sheet=new Image();
const rects=[[466,10,266,320],[740,10,266,320],[1008,10,260,320],[1269,10,251,320],[466,340,266,320],[740,340,266,320],[1008,340,260,320],[1269,340,251,320]];
const names=['Спокойствие','Смех','Злость','Удивление','Хитрость','Улыбка','Сомнение','Волнение'];let mood=0,ready=false,speaking=false,micActive=false,level=0,stream,ctx,analyser,frame,phase=0,micSession=0;
function draw(i){if(!ready)return;const [x,y,w,h]=rects[i],sx=sheet.naturalWidth/1536,sy=sheet.naturalHeight/1024;g.fillStyle='#e9e5e5';g.fillRect(0,0,480,480);const dh=480,dw=w/h*dh;g.drawImage(sheet,x*sx,y*sy,w*sx,h*sy,(480-dw)/2,0,dw,dh)}
sheet.onload=()=>{ready=true;draw(mood);s.textContent='На связи'};sheet.onerror=()=>{s.textContent='Не удалось открыть biker.png'};sheet.src='biker.png';
const voice=document.getElementById('voice');let speechText='',speechMood=0;
function classify(t){
 t=t.toLowerCase();
 if(/ха[- ]?ха|хе[- ]?хе|смешно|умора|ржу|анекдот/.test(t))return 1;
 if(/бесит|злюсь|ярость|ненавиж|возмут|разозлил|чёрт побери/.test(t))return 2;
 if(/ничего себе|невероятно|вот это да|неужели|удив|ого\b/.test(t))return 3;
 if(/секрет|хитр|подкол|шутк|прикол/.test(t))return 4;
 if(/здорово|класс|отлично|спасибо|рад|погнали|рок-н-ролл|круто|ура/.test(t))return 5;
 if(/не уверен|сомнева|возможно|наверное|почему|разве|\?/.test(t))return 6;
 if(/боюсь|страшно|тревог|пережива|опасно|волну|сочувств|грустно|сожале/.test(t))return 7;
 return 0;
}
function prepareSpeech(t){speechText=t;speechMood=classify(t.split(/(?<=[.!?])\s+/)[0]||t);mood=speechMood;draw(mood)}
function nativeSpeechRange(start){let a=speechText.lastIndexOf('.',start-1),b=speechText.lastIndexOf('!',start-1),d=speechText.lastIndexOf('?',start-1);let begin=Math.max(a,b,d)+1;let tail=speechText.slice(begin);let end=tail.search(/[.!?]/);speechMood=classify(end<0?tail:tail.slice(0,end+1));mood=speechMood;if(speaking)draw(mood)}
function nativeVoices(list,selected){voice.replaceChildren();if(!list.length){voice.add(new Option('Системный голос',''));voice.disabled=true;return}voice.disabled=false;list.forEach((v,i)=>voice.add(new Option('Русский '+(i+1)+(v.network?' · онлайн':' · офлайн')+' · '+v.id,v.id)));if(list.some(v=>v.id===selected))voice.value=selected}
voice.onchange=()=>{if(window.AndroidVoice&&AndroidVoice.selectVoice)AndroidVoice.selectVoice(voice.value)};
if(window.AndroidVoice&&AndroidVoice.listVoices)AndroidVoice.listVoices();else{voice.replaceChildren(new Option('Системный голос',''));voice.disabled=true}
setInterval(()=>{phase++;document.querySelector('#micMeter span').style.width=(micActive?Math.min(100,level*400):0)+'%';if(speaking){draw(speechMood)}else if(micActive){draw(6)}else draw(mood)},180);
function nativeSpeechStart(){speaking=true;draw(speechMood);s.textContent='Байкер говорит'}function nativeSpeechEnd(){speaking=false;draw(mood);s.textContent=micActive?'Слушаю':'На связи'}
function nativeMicStarted(session){if(session!==micSession)return;micActive=true;s.textContent='Слушаю';}function nativeMicLevel(session,rms){if(session===micSession){level=rms;}}function nativeMicError(session,message){if(session!==micSession)return;micActive=false;level=0;s.textContent=message;draw(mood)}function nativeSpeechError(message){speaking=false;s.textContent=message;draw(mood)}function nativeAudioPaused(){requestSeq++;micSession++;micActive=false;speaking=false;level=0;s.textContent='На связи';draw(mood)}
async function stopMic(){micSession++;if(window.AndroidVoice&&typeof AndroidVoice.stopMic==='function')AndroidVoice.stopMic();cancelAnimationFrame(frame);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;micActive=false;level=0}
async function speakText(t){await stopMic();prepareSpeech(t);if(window.AndroidVoice){AndroidVoice.speak(t)}else if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.onstart=nativeSpeechStart;u.onboundary=e=>nativeSpeechRange(e.charIndex);u.onend=nativeSpeechEnd;u.onerror=nativeSpeechEnd;speechSynthesis.speak(u)}else{s.textContent='Озвучка недоступна'}}
const endpoint=document.getElementById('endpoint'),token=document.getElementById('token'),phrase=document.getElementById('phrase'),answer=document.getElementById('answer');
let history=[],requestSeq=0;
try{endpoint.value=localStorage.getItem('bikerEndpoint')||''}catch(e){}
endpoint.onchange=()=>{requestSeq++;history=[];try{localStorage.setItem('bikerEndpoint',endpoint.value.trim())}catch(e){}};
token.onchange=()=>{requestSeq++;history=[]};
document.getElementById('resetChat').onclick=()=>{requestSeq++;history=[];answer.textContent='';s.textContent='Новый разговор'};
let pendingQuestion='';
async function ask(text){
 text=text.trim();if(!text)return;
 const seq=++requestSeq;await stopMic();if(seq!==requestSeq)return;
 if(window.AndroidVoice)AndroidVoice.stop();
 speaking=false;
 if(!endpoint.value.trim().startsWith('https://')||!token.value.trim()){s.textContent='Укажи HTTPS-адрес и токен сервера в настройках GPT';return;}
 if(!window.AndroidVoice||!AndroidVoice.askGpt){s.textContent='GPT доступен в Android-приложении';return;}
 const messages=history.concat({role:'user',content:text}).slice(-12);
 pendingQuestion=text;s.textContent='Байкер думает…';answer.textContent=text;
 AndroidVoice.askGpt(seq,endpoint.value.trim(),token.value.trim(),JSON.stringify(messages));
}
function nativeGptReply(seq,reply){if(seq!==requestSeq)return;history=history.concat({role:'user',content:pendingQuestion},{role:'assistant',content:reply}).slice(-12);answer.textContent=reply;speakText(reply)}
function nativeGptError(seq,message){if(seq===requestSeq)s.textContent=message}
function nativeRecognized(session,text){if(session!==micSession)return;micActive=false;level=0;phrase.value=text;ask(text)}
document.getElementById('speak').onclick=()=>ask(phrase.value);document.getElementById('sample').onclick=()=>{requestSeq++;speakText('Здорово! Ну что, погнали?')};
document.getElementById('listen').onclick=async()=>{requestSeq++;if(window.AndroidVoice)AndroidVoice.stop();else if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;await stopMic();if(window.AndroidVoice&&typeof AndroidVoice.startMic==='function'){s.textContent='Подключаю микрофон…';AndroidVoice.startMic(micSession);return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=512;ctx.createMediaStreamSource(stream).connect(analyser);let data=new Uint8Array(512);micActive=true;s.textContent='Слушаю';function tick(){analyser.getByteTimeDomainData(data);let sum=0;for(let v of data)sum+=((v-128)/128)**2;level=Math.sqrt(sum/512);frame=requestAnimationFrame(tick)}tick()}catch(e){await stopMic();s.textContent='Микрофон: '+(e.message||e.name||'неизвестная ошибка')}};
document.getElementById('stop').onclick=async()=>{requestSeq++;if(window.AndroidVoice)AndroidVoice.stop();else if('speechSynthesis'in window)speechSynthesis.cancel();await stopMic();nativeSpeechEnd()};
</script></body></html>
